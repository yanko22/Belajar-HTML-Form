<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Image</title>
  </head>
  <body>
    <!-- 
    Input Image
    1. input type image bukan digunakan utnuk input berupa berkas gambar, melainkan digunakna untuk membuat tombol submit namun berupa gambar
    2. inpu type button, submit atau reset menggunakan text untuk tombolnya, sedangkan image menggunakna gambar yang bisa di ubah menggunakan atribut src -->
    <form action="">
      <input type="hidden" name="user_id" value="ardi" />
      <label for="nama">Nama</label>
      <input type="text" name="nama" id="nama" /><br />
      <input
        type="image"
        src="asset/image/geralt-download-1536633_1920.png"
        alt="tumbol_submit"
        height="500px"
        width="auto" />
    </form>
  </body>
</html>
