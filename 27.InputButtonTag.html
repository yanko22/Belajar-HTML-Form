    <!-- 
    Button Tag
    1. Button tag adalah tag yang bisa kit gunakan untuk membuat tombol:
    2. dikarenakan button adalah tag memiliki conten didalam tagnya, jadi kita bisa dengan bebas menambahkan isi dari button, misal text atau gambar;
    3. jadi menggunakan button tag akan lebih flexible dibanding mengunakna input type button
    4. Button juga memiliki atribut type, yang bisa kita gunakna untuk mengubah jenis tipe button, dari mulai button (biasa), reset dan submit -->
    <form action="#">
      <label for="nama">Nama</label>
    </form>
