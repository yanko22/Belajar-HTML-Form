<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Email</title>
  </head>
  <body>
    <!-- 
    Input Email
    1. Input email adalah input text, namun informasi yang dimasukan harus dalam format email
    2. Jika format email tidak benar, secara otomatis form tidak akan bisa di submit -->
    <form action="#">
      <label for="email">Email</label> <br />
      <input type="email" name="email" id="email" required /> <br />
      <input type="submit" value="simpan" />
    </form>
  </body>
</html>
