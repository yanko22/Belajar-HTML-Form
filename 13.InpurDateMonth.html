<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mount</title>
  </head>
  <body>
    <!-- 
    Input Month
    1. Input type month digunakan untuk input informasi berupa tahun dan bulan;
    2. Format value untuk input type month adalah yyyy-mm;
    3. yyyy adalah 4 digit tahun;
    4. mm adalah 2 digit bulan;
    5. untuk batas minimal dan maksimal bisa menggunakan atribut min dan max -->
    <form action="#">
      <label for="bulan">Bulan</label>
      <input type="month" name="Bulan" id="Bulan" value="2026-01" />
      <input type="submit" value="simpan" />
    </form>
  </body>
</html>
