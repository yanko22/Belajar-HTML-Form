<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input URL</title>
  </head>
  <body>
    <!-- 
    Input URL
    1. Input type URL digunakan untuk meneriam input data dalam bentuk URL, seperti alamat website pribadi, website social media dll
    2. Jika format url tidak valid, maka HTML tidak akan menerima input data url tersebut;-->
    <form action="#">
      <label for="url">URL</label>
      <input type="url" name="url" id="url" /> <br />
      <input type="submit" value="simpan" />
    </form>
  </body>
</html>
