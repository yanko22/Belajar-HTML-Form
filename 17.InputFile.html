<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input File</title>
  </head>
  <body>
    <!-- 
    Input File
    1. input dengan type file, digunakan untuk meng-upload / mengunggah berkas filedari komputer kita;
    2. saat kita membuat input dengan type file, maka agar form mengirim berkas file-nya, kita harus gunakan method post, juga enctype multipart/form-data; -->
    <form action="#" method="post" enctype="multipart/form-data">
      <label for="submit_file">File</label>
      <input type="file" name="submit_file" id="submit_file" />
      <input type="submit" value="simpan" />
    </form>
  </body>
</html>
