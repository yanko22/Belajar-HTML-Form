<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Time</title>
  </head>
  <body>
    <!-- 
    Input Time
    1. Jika kita hanya membutuhkan informasi jam dan menit, kita bisa menggunakan input type tim;
    2. Input Type time menggunakan gormat hh:mm;
    3. HH adalah jam dalam 2 digit;
    4. mm adalah menit dalam 2 digit;
    5. untuk membatasi minimal dan maksimal dapat menggunakan min dan max -->
    <form>
      <label for="jam_masuk">Jam Masuk</label>
      <input type="time" name="jam_masuk" id="jam_masuk" value="07:00" />
      <br />
      <label for="jamkeluark">Jam Masuk</label>
      <input type="time" name="jam_keluar" id="jam_keluar" value="15:00" />
      <br />
      <input type="submit" value="simpan" />
    </form>
  </body>
</html>
