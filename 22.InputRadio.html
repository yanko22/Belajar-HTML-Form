<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Radio</title>
  </head>
  <body>
    <!-- 
    Input Radio
    1.  Inptu type radio merupakan input untuk informasi pilihan;
    2. pada checkbox, kita bisa memilih lebih dari satu checkbox walaupun menggunakna name yang sama
    3, sedangkan pada radio, kita hanya bisa memilih salah satu saja radio pada input name yang sama;
    4. Input ini cocok untuk data pilihan ganda;-->
    <form action="#" method="get">
      3.000 + 2.500 = <br />
      <input type="radio" name="jawaban" id="jawaban1" value="a" />
      <label for="jawaban1">4.500</label><br />
      <input type="radio" name="jawaban" id="jawaban2" value="b" />
      <label for="jawaban2">5.000</label><br />
      <input type="radio" name="jawaban" id="jawaban3" value="c" />
      <label for="jawaban3">5.5000</label><br />
      <input type="radio" name="jawaban" id="jawaban4" value="d" />
      <label for="jawaban4">6.000</label><br />
      <input type="submit" value="simpan" />
    </form>
  </body>
</html>
