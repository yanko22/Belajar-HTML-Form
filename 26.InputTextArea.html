<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Area</title>
  </head>
  <body>
    <!-- 
        Text Area Tag
        1. HTML juga menyediakan tag textarea, yang bisa digunakan untuk input text yang multi baris
        2.Untuk menentukan panjang input, kita bisa gunakna atribut cols, dan utnuk menentukan tinggi input, kita bisa gunakan rows; -->
    <form action="#">
      <label for="textarea"> Deskripsi</label>
      <textarea name="textarea" id="textarea" cols="10" rows="15">
ini text area</textarea
      >
      <input type="submit" value="simpan" />
    </form>
  </body>
</html>
