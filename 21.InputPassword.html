<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Password</title>
  </head>
  <body>
    <!-- 
    Input Password
    1. Input type password adalah input untuk informasi teks sama seperti input type text, namun pada input type password, karakter akan di masking (tidak ditampilkan);
    2. Input type password sangat cocok untuk input teks yang rahasia, sehingga tidak bisa diintip ole orang lain;-->
    <form action="#" method="post">
      <label for="email">Email</label><br />
      <input type="email" id="email" placeholder="Email@gmail.com" /><br />
      <label for="password">password </label><br />
      <input type="password" id="password" /><br />
      <input type="submit" value="simpan" />
    </form>
  </body>
</html>
